name: Publish Voidcord Release
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Immutable release tag
                required: true
                default: v0.1.0-equicord
permissions:
    contents: write
jobs:
    release:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/setup-go@v6
              with:
                  go-version-file: Installer/go.mod
                  cache-dependency-path: Installer/go.sum
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:custom-plugins
            - run: pnpm testTsc
            - run: pnpm buildStandalone
            - run: pnpm buildWebStandalone
            - run: go test -tags cli ./...
              working-directory: Installer
            - run: go build -trimpath -tags cli -o build/VoidcordInstallerCli.exe .
              working-directory: Installer
            - name: Package and publish
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  if ($env:RELEASE_TAG -notmatch '^v[0-9][a-zA-Z0-9._-]*$') { throw 'Invalid tag' }
                  New-Item -ItemType Directory release | Out-Null
                  Copy-Item dist/desktop.asar,dist/equibop.asar,dist/extension-chrome.zip,dist/extension-firefox.zip release/
                  Copy-Item Installer/build/VoidcordInstallerCli.exe release/
                  Copy-Item WINDOWS.md release/INSTALL-Windows.md
                  Compress-Archive -Path dist/desktop/* -DestinationPath release/Voidcord-Desktop.zip
                  $files = Get-ChildItem release -File | Sort-Object Name
                  $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content release/SHA256SUMS.txt -Encoding ascii
                  gh release create $env:RELEASE_TAG --verify-tag --title "Voidcord Equicord $env:GITHUB_SHA" --notes-file WINDOWS.md --draft release/*
                  if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
                  gh release edit $env:RELEASE_TAG --draft=false --latest
                  if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
